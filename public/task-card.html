<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        var p = new URLSearchParams(window.location.search);
        var css = p.get("hana-css");
        if (css) {
          var link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = css;
          document.head.appendChild(link);
        }
      })();
    </script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: var(
          --font-ui,
          -apple-system,
          BlinkMacSystemFont,
          "PingFang SC",
          sans-serif
        );
        font-size: 0.78rem;
        line-height: 1.6;
        color: var(--text, #3b3d3f);
        background: var(--bg-card, #fcfaf5);
        overflow: hidden;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      /* Bar (header, fixed) */
      .bar {
        flex-shrink: 0;
        height: 56px;
        padding: 0 10px;
        cursor: pointer;
        user-select: none;
        background: var(--bg, #f8f5ed);
        border-bottom: 1px solid var(--border, rgba(83, 125, 150, 0.15));
        display: flex;
        flex-direction: column;
        justify-content: center;
        transition: background var(--duration-fast, 0.15s)
          var(--ease-out, cubic-bezier(0.16, 1, 0.3, 1));
      }
      .bar:hover {
        background: var(--overlay-subtle, rgba(0, 0, 0, 0.05));
      }

      .bar-line1 {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 0;
      }

      .bar-tool-icon {
        flex-shrink: 0;
        width: 20px;
        height: 20px;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.72rem;
        background: var(--accent, #537d96);
        color: #fff;
      }
      .bar-tool-icon.codex {
        background: var(--green, #7bae7f);
      }

      .bar-msg {
        font-size: 0.72rem;
        font-weight: 500;
        color: var(--text, #3b3d3f);
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .bar-status-badge {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 1px 6px;
        border-radius: 10px;
        font-size: 0.6rem;
        font-weight: 500;
        line-height: 1.4;
      }
      .bar-status-badge.pending  { background: rgba(142,145,150,0.15); color: var(--text-muted, #8e9196); }
      .bar-status-badge.running  { background: rgba(123,174,127,0.15); color: var(--green, #5a9e5f); }
      .bar-status-badge.done     { background: rgba(83,125,150,0.15);  color: var(--accent, #537d96); }
      .bar-status-badge.failed   { background: rgba(139,58,58,0.15);  color: var(--danger, #8b3a3a); }
      .bar-status-badge.aborted  { background: rgba(236,143,141,0.15); color: var(--coral, #c0706e); }

      .bar-status-icon {
        font-size: 0.6rem;
      }

      .bar-chevron {
        flex-shrink: 0;
        width: 16px;
        height: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-muted, #8e9196);
        transition: transform var(--duration-fast, 0.15s)
          var(--ease-out, cubic-bezier(0.16, 1, 0.3, 1));
      }
      .bar-chevron svg {
        width: 12px;
        height: 12px;
      }
      .bar-chevron[data-open="true"] {
        transform: rotate(90deg);
      }

      .bar-line2 {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.62rem;
        color: var(--text-muted, #8e9196);
        margin-top: 3px;
        padding-left: 28px;
      }

      .bar-cwd {
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .bar-step-count {
        flex-shrink: 0;
        margin-left: 8px;
        font-family: var(--font-mono, "JetBrains Mono", ui-monospace, monospace);
        font-size: 0.58rem;
      }

      /* Panel (scrollable body) */
      .panel {
        display: none;
        flex: 1;
        overflow-y: auto;
        padding: 6px 10px 8px;
      }
      .panel.open {
        display: block;
      }

      .steps {
        border: 1px solid var(--border, rgba(83, 125, 150, 0.22));
        border-radius: var(--radius-sm, 6px);
        background: var(--bg, #f8f5ed);
      }

      .step {
        padding: 5px 8px;
        border-bottom: 1px solid var(--border, rgba(83, 125, 150, 0.12));
        display: flex;
        gap: 6px;
        align-items: flex-start;
        transition: background var(--duration-fast, 0.15s)
          var(--ease-out, cubic-bezier(0.16, 1, 0.3, 1));
      }
      .step:last-child { border-bottom: none; }
      .step:hover { background: var(--overlay-subtle, rgba(0, 0, 0, 0.03)); }

      .step-icon { flex-shrink: 0; width: 14px; text-align: center; font-size: 0.68rem; padding-top: 1px; }
      .step-body { flex: 1; min-width: 0; }
      .step-title { font-size: 0.68rem; font-weight: 500; color: var(--text, #3b3d3f); }
      .step-detail { font-size: 0.62rem; color: var(--text-muted, #8e9196); margin-top: 1px; word-break: break-all; }
      .step-time { font-size: 0.58rem; color: var(--text-muted, #8e9196); flex-shrink: 0; padding-top: 1px; }

      .result {
        margin-top: 6px;
        padding: 6px 8px;
        border-radius: var(--radius-sm, 6px);
        background: var(--bg, #f8f5ed);
        border: 1px solid var(--border, rgba(83, 125, 150, 0.22));
        white-space: pre-wrap;
        word-break: break-all;
        font-family: var(--font-mono, "JetBrains Mono", ui-monospace, monospace);
        font-size: 0.68rem;
        line-height: 1.5;
        color: var(--text, #3b3d3f);
      }
      .result.error { color: var(--danger, #8b3a3a); border-color: var(--danger, #8b3a3a); }

      .summary {
        margin-top: 4px;
        font-size: 0.72rem;
        color: var(--text-muted, #8e9196);
      }

      .prompt-box {
        margin-bottom: 6px;
        padding: 6px 8px;
        border-radius: var(--radius-sm, 6px);
        background: var(--bg, #f8f5ed);
        border: 1px solid var(--border, rgba(83, 125, 150, 0.22));
        font-family: var(--font-mono, "JetBrains Mono", ui-monospace, monospace);
        font-size: 0.65rem;
        line-height: 1.5;
        color: var(--text-muted, #8e9196);
        white-space: pre-wrap;
        word-break: break-all;
      }
      .prompt-label {
        font-family: var(--font-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif);
        font-size: 0.6rem;
        font-weight: 500;
        color: var(--text-muted, #8e9196);
        margin-bottom: 2px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .panel::-webkit-scrollbar { width: 4px; }
      .panel::-webkit-scrollbar-thumb {
        background: var(--border, rgba(83, 125, 150, 0.22));
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <div class="bar" id="bar">
      <div class="bar-line1">
        <div class="bar-tool-icon" id="toolIcon">C</div>
        <div class="bar-msg" id="barMsg">Initializing...</div>
        <div class="bar-status-badge pending" id="statusBadge">
          <span class="bar-status-icon" id="statusIcon">⏳</span>
          <span id="statusText">waiting</span>
        </div>
        <div class="bar-chevron" id="chevron" data-open="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
      </div>
      <div class="bar-line2">
        <span class="bar-cwd" id="barCwd"></span>
        <span class="bar-step-count" id="barStepCount"></span>
      </div>
    </div>
    <div class="panel" id="panel">
      <div class="prompt-box" id="promptBox" style="display:none">
        <div class="prompt-label">Prompt</div>
        <div id="promptText"></div>
      </div>
      <div class="steps" id="steps"></div>
      <div class="result" id="result" style="display: none"></div>
      <div class="summary" id="summary"></div>
    </div>

    <script>
      (function () {
        var taskId = new URLSearchParams(window.location.search).get("taskId") || "";
        var toolIcon = document.getElementById("toolIcon");
        var barMsg = document.getElementById("barMsg");
        var barCwd = document.getElementById("barCwd");
        var statusBadge = document.getElementById("statusBadge");
        var statusIcon = document.getElementById("statusIcon");
        var statusText = document.getElementById("statusText");
        var barStepCount = document.getElementById("barStepCount");
        var chevron = document.getElementById("chevron");
        var panel = document.getElementById("panel");
        var stepsEl = document.getElementById("steps");
        var resultEl = document.getElementById("result");
        var summaryEl = document.getElementById("summary");
        var lastStepCount = 0;
        var expanded = false;
        var msgIndex = -1;
        var promptShown = false;

        // Friendly messages per tool, selected by taskId hash
        var messages = {
          claude: [
            "Claude is coding hard",
            "Claude is thinking deeply",
            "Claude is crafting code",
            "Claude is on it",
            "Claude is hustling",
            "Claude is in the zone",
          ],
          codex: [
            "Codex is coding hard",
            "Codex is thinking deeply",
            "Codex is crafting code",
            "Codex is on it",
            "Codex is hustling",
            "Codex is in the zone",
          ],
        };

        function hashTaskId(id) {
          var h = 0;
          for (var i = 0; i < id.length; i++) {
            h = ((h << 5) - h + id.charCodeAt(i)) | 0;
          }
          return Math.abs(h);
        }

        function getMsgIndex(tool) {
          if (msgIndex >= 0) return msgIndex;
          var pool = messages[tool] || messages.claude;
          msgIndex = hashTaskId(taskId) % pool.length;
          return msgIndex;
        }

        var stepStatusMap = {
          session_init: "init",
          thinking: "thinking",
          tool_call: "calling",
          tool_result: "done",
          file_change: "editing",
          text: "writing",
          result: "done",
          error: "error",
        };

        var COLLAPSED_H = 56;
        var EXPANDED_H = 300;

        function requestResize(height) {
          window.parent.postMessage(
            { type: "resize-request", payload: { width: 400, height: height } },
            "*"
          );
        }

        document.getElementById("bar").addEventListener("click", function () {
          expanded = !expanded;
          panel.className = "panel" + (expanded ? " open" : "");
          chevron.setAttribute("data-open", expanded);
          requestResize(expanded ? EXPANDED_H : COLLAPSED_H);
        });

        function iconForType(type) {
          var icons = {
            thinking: "\u{1F9E0}", tool_call: "\u{1F507}", tool_result: "\u{2705}",
            file_change: "\u{1F4DD}", text: "\u{1F4AC}", session_init: "\u{1F680}",
            error: "\u{274C}", result: "\u{1F3C1}"
          };
          return icons[type] || "\u{2022}";
        }

        function stepTitle(s) {
          var data = s.data || {};
          if (s.type === "tool_call") return data.tool || "tool_call";
          if (s.type === "file_change") return data.action === "write" ? "Created file" : "Modified file";
          if (s.type === "thinking") return "Thinking";
          if (s.type === "text") return "Writing";
          if (s.type === "result") return "Done";
          if (s.type === "error") return "Error";
          if (s.type === "session_init") return "Session started";
          return s.type || "";
        }

        function stepDetail(s) {
          var data = s.data || {};
          if (s.type === "tool_call") return data.summary || "";
          if (s.type === "file_change") return data.path || "";
          if (s.type === "thinking") return (data.text || "").slice(0, 150);
          if (s.type === "text") return (data.text || "").slice(0, 120);
          if (s.type === "error") return data.message || "";
          return "";
        }

        function timeAgo(iso) {
          if (!iso) return "";
          var ms = Date.now() - new Date(iso).getTime();
          if (ms < 60000) return Math.round(ms / 1000) + "s";
          return Math.round(ms / 60000) + "m";
        }

        function escapeHtml(s) {
          return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function renderSteps(steps) {
          if (!steps || steps.length === lastStepCount) return;
          lastStepCount = steps.length;
          var wasAtBottom = panel.scrollHeight - panel.scrollTop - panel.clientHeight < 30;
          stepsEl.innerHTML = steps
            .map(function (s) {
              var detail = stepDetail(s);
              return (
                '<div class="step">' +
                '<span class="step-icon">' + iconForType(s.type) + "</span>" +
                '<div class="step-body">' +
                '<div class="step-title">' + escapeHtml(stepTitle(s)) + "</div>" +
                (detail ? '<div class="step-detail">' + escapeHtml(detail) + "</div>" : "") +
                "</div>" +
                '<span class="step-time">' + timeAgo(s.ts) + "</span>" +
                "</div>"
              );
            })
            .join("");
          if (wasAtBottom) panel.scrollTop = panel.scrollHeight;
        }

        var toolIcons = { claude: "C", codex: "X" };
        var statusIcons = {
          pending: "⏳", running: "⚡", done: "✓", failed: "✗", aborted: "⊘"
        };
        var statusLabels = {
          pending: "waiting", running: "running", done: "done",
          failed: "failed", aborted: "aborted"
        };

        function update(task) {
          if (!task) return;

          // Show prompt on first load
          if (!promptShown && task.prompt) {
            promptShown = true;
            var promptBox = document.getElementById("promptBox");
            document.getElementById("promptText").textContent = task.prompt;
            promptBox.style.display = "block";
          }

          // Tool icon
          toolIcon.textContent = toolIcons[task.tool] || "C";
          toolIcon.className = "bar-tool-icon" + (task.tool === "codex" ? " codex" : "");

          // Bar line 1: friendly message
          var pool = messages[task.tool] || messages.claude;
          var mi = getMsgIndex(task.tool);
          if (task.status === "done") {
            barMsg.textContent = pool[mi].replace("coding", "done coding").replace("thinking", "done thinking").replace("crafting", "done crafting");
          } else if (task.status === "failed" || task.status === "aborted") {
            barMsg.textContent = task.tool + " stopped";
          } else {
            barMsg.textContent = pool[mi];
          }

          // Status badge
          statusBadge.className = "bar-status-badge " + (task.status || "pending");
          statusIcon.textContent = statusIcons[task.status] || "⏳";

          var steps = task.steps || [];
          var stepCount = steps.length;
          if (task.status === "done") {
            statusText.textContent = "done";
          } else if (task.status === "failed") {
            statusText.textContent = "failed";
          } else if (task.status === "aborted") {
            statusText.textContent = "aborted";
          } else if (stepCount > 0) {
            var lastStep = steps[stepCount - 1];
            var label = stepStatusMap[lastStep.type] || lastStep.type;
            statusText.textContent = stepCount + " steps · " + label;
          } else {
            statusText.textContent = statusLabels[task.status] || task.status;
          }

          // Bar line 2: cwd + step count
          barCwd.textContent = task.cwd || "";
          barStepCount.textContent = stepCount > 0 ? stepCount + " steps" : "";

          renderSteps(steps);

          if (task.status === "done" && task.result) {
            resultEl.style.display = "block";
            resultEl.textContent = task.result.text || JSON.stringify(task.result, null, 2);
            summaryEl.textContent =
              task.result.fileChanges && task.result.fileChanges.length
                ? task.result.fileChanges.length + " file(s), " + (task.result.toolCallCount || 0) + " calls"
                : (task.result.toolCallCount || 0) + " tool calls";
          } else if (task.status === "failed" && task.error) {
            resultEl.style.display = "block";
            resultEl.className = "result error";
            var errText = task.error.message || "Failed";
            if (task.error.hint) {
              errText += "\n\n" + task.error.hint;
            }
            resultEl.textContent = errText;
          }

          requestResize(expanded ? EXPANDED_H : COLLAPSED_H);

          if (task.status === "running" || task.status === "pending") {
            setTimeout(poll, 1000);
          }
        }

        var urlParams = new URLSearchParams(window.location.search);
        var authToken = urlParams.get("token") || "";

        function poll() {
          var url =
            "/api/plugins/code-agent/tasks/" +
            encodeURIComponent(taskId) +
            (authToken ? "?token=" + encodeURIComponent(authToken) : "");
          fetch(url)
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (d) {
              if (d && d.task) update(d.task);
              else setTimeout(poll, 2000);
            })
            .catch(function () { setTimeout(poll, 2000); });
        }

        window.parent.postMessage({ type: "ready" }, "*");
        poll();
      })();
    </script>
  </body>
</html>
